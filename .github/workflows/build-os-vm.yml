name: Build CyberLab AI OS Live ISOs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/additive-forensics-recovery
    paths:
      - .github/workflows/build-os-vm.yml
      - scripts/os/**
      - os/**
      - kali-companion/**

concurrency:
  group: cyberlab-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-live-isos:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      DIST_DIR: ${{ github.workspace }}/cyberlab-dist
    steps:
      - name: Install Debian live-build toolchain
        run: |
          apt-get update
          apt-get install -y \
            live-build debootstrap debian-archive-keyring \
            xorriso squashfs-tools mtools dosfstools cpio \
            grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common \
            qemu-system-x86 ovmf git wget ca-certificates

      - uses: actions/checkout@v4

      - name: Validate OS shell script syntax
        run: |
          bash -n scripts/os/build-live-iso.sh
          bash -n scripts/os/boot-smoke-test.sh
          bash -n scripts/os/uefi-smoke-test.sh

      - name: Record tool versions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cyberlab-dist"
          dpkg-query -W live-build debootstrap ovmf
          qemu-system-x86_64 --version | head -n 1 \
            > "$GITHUB_WORKSPACE/cyberlab-dist/QEMU-VERSION.txt"
          find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' -print \
            | sort > "$GITHUB_WORKSPACE/cyberlab-dist/OVMF-FIRMWARE.txt"

      - name: Build lightweight desktop ISO
        run: |
          chmod +x scripts/os/*.sh
          ./scripts/os/build-live-iso.sh desktop-lite "$GITHUB_WORKSPACE/cyberlab-dist"

      - name: Boot-test lightweight desktop ISO in QEMU (BIOS)
        run: >
          ./scripts/os/boot-smoke-test.sh
          "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-desktop-lite-amd64.iso"
          desktop-lite
          "$GITHUB_WORKSPACE/cyberlab-dist/desktop-lite-boot.log"

      - name: Boot-test lightweight desktop ISO in QEMU (UEFI)
        id: desktop_lite_uefi
        continue-on-error: true
        run: >
          ./scripts/os/uefi-smoke-test.sh
          "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-desktop-lite-amd64.iso"
          desktop-lite
          "$GITHUB_WORKSPACE/cyberlab-dist/desktop-lite-uefi-boot.log"

      - name: Inspect desktop ISO UEFI boot catalog
        if: always()
        run: |
          xorriso -indev "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-desktop-lite-amd64.iso" -report_el_torito as_mkisofs
          xorriso -indev "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-desktop-lite-amd64.iso" -find /EFI -type f -exec lsdl

      - name: Inspect Desktop Lite GRUB configuration
        if: always()
        run: |
          ISO="$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-desktop-lite-amd64.iso"
          CFG="$RUNNER_TEMP/desktop-lite-grub.cfg"
          if [[ ! -s "$ISO" ]]; then
            echo "Desktop Lite ISO is unavailable; GRUB configuration inspection skipped."
            exit 0
          fi
          if xorriso -osirrox on -indev "$ISO" -extract /boot/grub/grub.cfg "$CFG"; then
            if [[ -s "$CFG" ]]; then
              echo "Extracted /boot/grub/grub.cfg:"
              sed -n '1,240p' "$CFG"
            else
              echo "GRUB configuration extraction produced an empty file."
            fi
          else
            echo "No /boot/grub/grub.cfg could be extracted from the ISO."
          fi
          CONFIG_CFG="$RUNNER_TEMP/desktop-lite-grub-config.cfg"
          if xorriso -osirrox on -indev "$ISO" -extract /boot/grub/config.cfg "$CONFIG_CFG"; then
            if [[ -s "$CONFIG_CFG" ]]; then
              echo "Extracted /boot/grub/config.cfg:"
              sed -n '1,240p' "$CONFIG_CFG"
            else
              echo "GRUB config.cfg extraction produced an empty file."
            fi
          else
            echo "No /boot/grub/config.cfg could be extracted from the ISO."
          fi

      - name: Free lightweight desktop build space
        run: rm -rf /var/tmp/cyberlab-ai-os-build/desktop-lite

      - name: Build lightweight terminal ISO
        run: ./scripts/os/build-live-iso.sh terminal "$GITHUB_WORKSPACE/cyberlab-dist"

      - name: Boot-test terminal ISO in QEMU (BIOS)
        run: >
          ./scripts/os/boot-smoke-test.sh
          "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-terminal-amd64.iso"
          terminal
          "$GITHUB_WORKSPACE/cyberlab-dist/terminal-boot.log"

      - name: Boot-test terminal ISO in QEMU (UEFI)
        id: terminal_uefi
        continue-on-error: true
        run: >
          ./scripts/os/uefi-smoke-test.sh
          "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-terminal-amd64.iso"
          terminal
          "$GITHUB_WORKSPACE/cyberlab-dist/terminal-uefi-boot.log"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-ai-os-boot-diagnostics
          path: cyberlab-dist/*-boot.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce required UEFI boot checks
        if: always()
        run: |
          failed=0
          if [[ "${{ steps.desktop_lite_uefi.outcome }}" != "success" ]]; then
            echo "Desktop Lite UEFI boot verification did not pass."
            failed=1
          fi
          if [[ "${{ steps.terminal_uefi.outcome }}" != "success" ]]; then
            echo "Terminal UEFI boot verification did not pass."
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            echo "ISO artifacts will not be published until every required UEFI boot check passes."
            exit 1
          fi

      - name: Publish ISO checksums
        run: |
          cd "$GITHUB_WORKSPACE/cyberlab-dist"
          sha256sum *.iso > SHA256SUMS

      - name: Upload lightweight desktop edition
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-ai-os-desktop-lite-amd64
          path: |
            cyberlab-dist/cyberlab-ai-os-desktop-lite-amd64.iso
            cyberlab-dist/cyberlab-ai-os-desktop-lite-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload terminal edition
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-ai-os-terminal-amd64
          path: |
            cyberlab-dist/cyberlab-ai-os-terminal-amd64.iso
            cyberlab-dist/cyberlab-ai-os-terminal-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7
