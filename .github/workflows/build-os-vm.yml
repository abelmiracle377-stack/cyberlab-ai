name: Build CyberLab AI OS Live ISOs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/additive-forensics-recovery
    paths:
      - .github/workflows/build-os-vm.yml
      - scripts/os/**
      - os/profiles/**
      - kali-companion/**

permissions:
  contents: read

jobs:
  build-live-isos:
    # Keep live-build and its Debian package metadata native to Debian Trixie.
    # Node 24 is included so GitHub JavaScript actions work inside the container.
    runs-on: ubuntu-24.04
    container:
      image: node:24-trixie
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian Trixie live-build toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            isolinux \
            syslinux-common \
            qemu-system-x86 \
            ca-certificates \
            file \
            python3
      - name: Build desktop ISO
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/os/*.sh
          ./scripts/os/build-live-iso.sh desktop "$RUNNER_TEMP/cyberlab-dist"
      - name: Build lightweight terminal ISO
        shell: bash
        run: ./scripts/os/build-live-iso.sh terminal "$RUNNER_TEMP/cyberlab-dist"
      - name: Record QEMU version
        shell: bash
        run: qemu-system-x86_64 --version | head -n 1 > "$RUNNER_TEMP/cyberlab-dist/QEMU-VERSION.txt"
      - name: Boot-test desktop ISO in QEMU
        shell: bash
        run: ./scripts/os/boot-smoke-test.sh "$RUNNER_TEMP/cyberlab-dist/cyberlab-ai-os-desktop-amd64.iso" desktop "$RUNNER_TEMP/cyberlab-dist/desktop-boot.log"
      - name: Boot-test terminal ISO in QEMU
        shell: bash
        run: ./scripts/os/boot-smoke-test.sh "$RUNNER_TEMP/cyberlab-dist/cyberlab-ai-os-terminal-amd64.iso" terminal "$RUNNER_TEMP/cyberlab-dist/terminal-boot.log"
      - name: Publish ISO checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/cyberlab-dist"
          sha256sum *.iso > SHA256SUMS
      - name: Upload CyberLab AI OS images
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-ai-os-live-isos-amd64
          path: ${{ runner.temp }}/cyberlab-dist/
          if-no-files-found: error
          retention-days: 7
