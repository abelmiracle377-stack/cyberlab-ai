name: Build CyberLab AI OS Live ISOs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/additive-forensics-recovery
    paths:
      - .github/workflows/build-os-vm.yml
      - scripts/os/**
      - os/**
      - kali-companion/**

concurrency:
  group: cyberlab-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-live-isos:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      DIST_DIR: ${{ github.workspace }}/cyberlab-dist
    steps:
      - name: Install Debian live-build toolchain
        run: |
          apt-get update
          apt-get install -y \
            live-build debootstrap debian-archive-keyring \
            xorriso squashfs-tools mtools dosfstools cpio \
            grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common \
            qemu-system-x86 git wget ca-certificates

      - uses: actions/checkout@v4

      - name: Record tool versions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cyberlab-dist"
          dpkg-query -W live-build debootstrap
          qemu-system-x86_64 --version | head -n 1 \
            > "$GITHUB_WORKSPACE/cyberlab-dist/QEMU-VERSION.txt"

      - name: Build desktop ISO
        run: |
          chmod +x scripts/os/*.sh
          ./scripts/os/build-live-iso.sh desktop "$GITHUB_WORKSPACE/cyberlab-dist"

      - name: Free build space
        run: rm -rf /var/tmp/cyberlab-ai-os-build/desktop

      - name: Build lightweight terminal ISO
        run: ./scripts/os/build-live-iso.sh terminal "$GITHUB_WORKSPACE/cyberlab-dist"

      - name: Boot-test desktop ISO in QEMU
        run: >
          ./scripts/os/boot-smoke-test.sh
          "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-desktop-amd64.iso"
          desktop
          "$GITHUB_WORKSPACE/cyberlab-dist/desktop-boot.log"

      - name: Boot-test terminal ISO in QEMU
        run: >
          ./scripts/os/boot-smoke-test.sh
          "$GITHUB_WORKSPACE/cyberlab-dist/cyberlab-ai-os-terminal-amd64.iso"
          terminal
          "$GITHUB_WORKSPACE/cyberlab-dist/terminal-boot.log"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-ai-os-boot-diagnostics
          path: cyberlab-dist/*-boot.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish ISO checksums
        run: |
          cd "$GITHUB_WORKSPACE/cyberlab-dist"
          sha256sum *.iso > SHA256SUMS

      - name: Upload CyberLab AI OS images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-ai-os-live-isos-amd64
          path: cyberlab-dist/
          if-no-files-found: error
          retention-days: 7
