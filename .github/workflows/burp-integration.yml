name: Kali companion security checks

on:
  push:
    branches:
      - feature/cyberlab-burp-integration
      - integration/cyberlab-unified-workstation
      - feature/burp-scanner-intruder-solidity-wallet-audit
    paths:
      - "burp-extension/**"
      - "kali-companion/burp_connector.py"
      - "kali-companion/intercept_proxy.py"
      - "kali-companion/proxy_certificates.py"
      - "kali-companion/test_intercept_proxy.py"
      - "kali-companion/parameter_lab.py"
      - "kali-companion/test_parameter_lab.py"
      - "kali-companion/parameter_analysis.py"
      - "kali-companion/test_parameter_analysis.py"
      - "kali-companion/bridge.py"
      - "kali-companion/parameter_analysis.py"
      - "kali-companion/test_parameter_analysis.py"
      - "kali-companion/network_capture.py"
      - "kali-companion/tool_catalog.py"
      - "kali-companion/test_tool_catalog.py"
      - "kali-companion/test_task_planner.py"
      - "kali-companion/web_testing.py"
      - "kali-companion/web_crawler.py"
      - "kali-companion/web_active_scan.py"
      - "kali-companion/tests/test_web_active_scan.py"
      - "app/web-scanner/**"
      - "kali-companion/tests/test_web_crawler.py"
      - "app/web-crawler/**"
      - "kali-companion/tests/test_web_testing.py"
      - "kali-companion/task_planner.py"
      - "lib/agent-orchestrator.ts"
      - "kali-companion/tests/test_network_capture.py"
      - "kali-companion/tests/test_web_testing.py"
      - "kali-companion/tests/test_burp_connector.py"
      - "app/network-intelligence/**"
      - "app/web-workbench/**"
      - "app/web-repeater/**"
      - "docs/NATIVE_WEB_WORKBENCH.md"
      - "app/page.tsx"
      - "app/agent/**"
      - "app/burp-suite/**"
      - "app/solidity/**"
      - "app/api/solidity/**"
      - "docs/BURP_INTEGRATION.md"
      - "docs/BLOCKCHAIN_ENGINEERING.md"
      - "docs/WALLET_RECOVERY_SECURITY_MODEL.md"
      - "docs/FILE_RECOVERY_CAPABILITIES.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/burp-integration.yml"
  pull_request:
    paths:
      - "burp-extension/**"
      - "kali-companion/parameter_lab.py"
      - "kali-companion/test_parameter_lab.py"
      - "kali-companion/parameter_analysis.py"
      - "kali-companion/test_parameter_analysis.py"
      - "kali-companion/bridge.py"
      - "kali-companion/wallet_recovery_planner.py"
      - "kali-companion/wallet_recovery_executor.py"
      - "kali-companion/tests/test_wallet_recovery_executor.py"
      - "kali-companion/tests/test_wallet_recovery_planner.py"
      - "docs/WALLET_RECOVERY_INTELLIGENCE.md"
      - "app/web-repeater/**"
      - "docs/NATIVE_WEB_WORKBENCH.md"
      - "kali-companion/burp_connector.py"
      - "kali-companion/intercept_proxy.py"
      - "kali-companion/proxy_certificates.py"
      - "kali-companion/test_intercept_proxy.py"
      - "kali-companion/bridge.py"
      - "kali-companion/network_capture.py"
      - "kali-companion/tests/test_network_capture.py"
      - "kali-companion/web_testing.py"
      - "kali-companion/web_crawler.py"
      - "kali-companion/web_active_scan.py"
      - "kali-companion/tests/test_web_active_scan.py"
      - "app/web-scanner/**"
      - "kali-companion/tests/test_web_crawler.py"
      - "app/web-crawler/**"
      - "kali-companion/tests/test_web_testing.py"
      - "kali-companion/task_planner.py"
      - "kali-companion/tool_catalog.py"
      - "lib/agent-orchestrator.ts"
      - "app/web-workbench/**"
      - "kali-companion/tests/test_burp_connector.py"
      - "app/network-intelligence/**"
      - "app/page.tsx"
      - "app/burp-suite/**"
      - "app/solidity/**"
      - "app/api/solidity/**"
      - "docs/BURP_INTEGRATION.md"
      - "docs/BLOCKCHAIN_ENGINEERING.md"
      - "docs/WALLET_RECOVERY_SECURITY_MODEL.md"
      - "docs/FILE_RECOVERY_CAPABILITIES.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/burp-integration.yml"

concurrency:
  group: burp-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  companion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Burp connector and planner
        timeout-minutes: 15
        env:
          PYTHONPATH: kali-companion
        run: |
          python -m unittest discover -s kali-companion -p "test_intercept_proxy.py" -v
          python -m unittest discover -s kali-companion -p "test_parameter_lab.py" -v
          python -m unittest discover -s kali-companion -p "test_parameter_analysis.py" -v
          python -m unittest discover -s kali-companion/tests -p "test_burp_connector.py" -v
          python -m unittest discover -s kali-companion/tests -p "test_network_capture.py" -v
          python -m unittest discover -s kali-companion/tests -p "test_web_testing.py" -v
          python -m unittest discover -s kali-companion/tests -p "test_web_crawler.py" -v
          python -m unittest discover -s kali-companion/tests -p "test_web_active_scan.py" -v
          python -m unittest discover -s kali-companion -p "test_task_planner.py" -v
          python -m unittest discover -s kali-companion/tests -p "test_wallet_recovery_planner.py" -v
          python -m unittest discover -s kali-companion/tests -p "test_wallet_recovery_executor.py" -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build CyberLab web application
        run: npm run build

  montoya-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Burp Montoya extension
        run: gradle -p burp-extension clean jar
      - name: Publish installable extension JAR
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-burp-extension
          path: burp-extension/build/libs/cyberlab-burp-connector-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
