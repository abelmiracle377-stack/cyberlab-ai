name: Release artifacts

# Push a version tag to build and publish the downloadable artifacts, so the
# permanent download links resolve:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CyberSOC standalone tarball
        run: bash scripts/package-cybersoc.sh dist
      - name: Build CyberLab OS build kit tarball
        run: bash scripts/package-os-builder.sh dist
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=""
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="rolling"; PRERELEASE="--prerelease"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/cybersoc.tar.gz dist/cyberlab-os-builder.tar.gz dist/SHA256SUMS.txt \
            --title "CyberLab AI $TAG" \
            --notes "Downloadable artifacts: **CyberSOC** standalone tool and the **CyberLab AI OS** build kit. Verify with SHA256SUMS.txt. The full OS VM image is produced from the build kit on a Debian builder host." \
            $PRERELEASE
