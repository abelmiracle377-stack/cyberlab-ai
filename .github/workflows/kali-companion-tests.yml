name: Kali Companion Tests

on:
  push:
    branches: [main, feature/kali-command-centre, integration/cyberlab-unified-workstation]
    paths:
      - "kali-companion/**"
      - "scripts/os/**"
      - "os/**"
      - ".github/workflows/kali-companion-tests.yml"
  pull_request:
    branches: [main]

concurrency:
  group: kali-companion-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway test dependencies
        run: python -m pip install -r kali-companion/vps_gateway/requirements.txt
      - name: Compile companion
        run: python -m py_compile kali-companion/cyberlab.py
      - name: Compile VPS gateway
        run: python -m py_compile kali-companion/vps_gateway/app.py
      - name: Validate VPS installer shell syntax
        run: for script in kali-companion/vps_gateway/install-ubuntu.sh kali-companion/vps_gateway/configure-caddy.sh; do bash -n "$script"; done
      - name: Validate consent page assets
        run: test -s kali-companion/vps_gateway/consent.html && grep -q 'Grant selected permissions' kali-companion/vps_gateway/consent.html && grep -q 'Stop and disconnect' kali-companion/vps_gateway/consent.html
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/kali-companion
        run: |
          python -m unittest discover -s kali-companion -p 'test_*.py' -v
          python -m unittest discover -s kali-companion/tests -p 'test_wallet_recovery_*.py' -v
      - name: Validate sandbox runner and browser extension
        run: |
          python -m py_compile kali-companion/ssh_audit.py
          python -m unittest discover -s kali-companion/tests -p 'test_ssh_audit.py' -v
          python -m py_compile sandbox/runner.py
          python -m json.tool browser-extension/manifest.json > /dev/null
          node --check browser-extension/service-worker.js
          node --check browser-extension/cyberlab-content.js
          node --check browser-extension/popup.js
