name: Kali Companion Tests

on:
  push:
    branches: [main, feature/kali-command-centre]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile companion
        run: python -m py_compile kali-companion/cyberlab.py
      - name: Run unit tests
        run: python -m unittest discover -s kali-companion -p 'test_*.py' -v
