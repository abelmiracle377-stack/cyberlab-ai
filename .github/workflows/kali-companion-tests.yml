name: Kali Companion Tests

on:
  push:
    branches: [main, feature/kali-command-centre]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway test dependencies
        run: python -m pip install -r kali-companion/vps_gateway/requirements.txt
      - name: Compile companion
        run: python -m py_compile kali-companion/cyberlab.py
      - name: Compile VPS gateway
        run: python -m py_compile kali-companion/vps_gateway/app.py
      - name: Validate consent page assets
        run: test -s kali-companion/vps_gateway/consent.html && grep -q 'Grant selected permissions' kali-companion/vps_gateway/consent.html && grep -q 'Stop and disconnect' kali-companion/vps_gateway/consent.html
      - name: Run unit tests
        run: python -m unittest discover -s kali-companion -p 'test_*.py' -v
