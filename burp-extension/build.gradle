plugins {
    id 'java'
}

group = 'ai.cyberlab'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveBaseName = 'cyberlab-burp-connector'
    manifest {
        attributes(
            'Implementation-Title': 'CyberLab Burp Connector',
            'Implementation-Version': project.version
        )
    }
}
