<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberLab Browser Share</title><style>body{font:14px system-ui;background:#0d1117;color:#e6edf3;width:320px;padding:16px}button{width:100%;padding:11px;margin:5px 0;border:0;border-radius:8px;background:#238636;color:white;font-weight:600;cursor:pointer}button.secondary{background:#30363d}button.danger{background:#8b2525}p{color:#8b949e;line-height:1.5}.status{margin-top:12px;white-space:pre-wrap;color:#7ee787;font-size:12px}</style></head><body><h2>CyberLab Browser Workspace</h2><p>Inspect the active tab. Session-cookie capture is a separate explicit action; cookie values remain only in volatile extension memory and are never sent to the CyberLab web app.</p><button id="share">Inspect active tab</button><button id="capture" class="secondary">Capture session cookies locally</button><button id="clear" class="danger">Clear captured session cookies</button><div id="status" class="status">No operation started.</div><script src="popup.js"></script></body></html>
